    function openQuickTopicPicker() {
      if (state.data.subjects.length === 0) {
        openSubjectFormSheet();
        return;
      }
      openSheet('Choose Subject for New Topic', `
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${state.data.subjects.map((s) => `
            <button class="btn btn-outline btn-block" style="justify-content:space-between;"
              onclick="openTopicFormSheet('${s.id}')">
              <span style="text-align:left;">${escapeHtml(s.name)}</span>
              <span class="marks-pill">${s.marks} M</span>
            </button>
          `).join('')}
        </div>

    function submitTopicForm(event, subjectId, editTopicId) {
      event.preventDefault();
      const sub = findSubject(subjectId);
      if (!sub) return;
      const title = document.getElementById('top-title').value.trim();
      const priority = document.getElementById('top-priority').value;
      const notes = document.getElementById('top-notes').value.trim();
      if (!title) return;

      if (editTopicId) {
        const top = findTopic(subjectId, editTopicId);
        if (top) {
          top.title = title;
          top.priority = priority;
          top.notes = notes;
          showSnackbar('Topic updated!');
        }
      } else {
        sub.topics.push({
          id: uid('top'),
          title,
          priority,
          notes,
          logs: []
        });
        state.expandedSubjectIds.add(sub.id);
        showSnackbar('Topic added to syllabus!');
      }

      saveState();
      closeSheet();
      render();
    }

    /* =========================================================================
       13. INLINE ACTIONS & CUSTOM CONFIRMATION DIALOGS (NO alert/confirm!)
       ========================================================================= */
    function saveTopicInlineNotes(subjectId, topicId) {
      const topic = findTopic(subjectId, topicId);
      const box = document.getElementById('topic-inline-notes');
      if (!topic || !box) return;
      topic.notes = box.value.trim();
      saveState();
      showSnackbar('Topic notes saved!');
    }

    function deleteLogEntry(subjectId, topicId, logId) {
      const topic = findTopic(subjectId, topicId);
      if (!topic) return;
      topic.logs = topic.logs.filter((l) => l.id !== logId);
      saveState();
      render();
      openTopicDetailSheet(subjectId, topicId);
      showSnackbar('Log entry removed.');
    }

    function confirmDeleteTopic(subjectId, topicId) {
      const topic = findTopic(subjectId, topicId);
      if (!topic) return;
      openSheet('Delete Topic?', `
        <p style="font-size:13.5px; color:var(--text-secondary); margin-bottom:16px;">
          Are you sure you want to delete <strong>${escapeHtml(topic.title)}</strong> and all its date/time study logs?
        </p>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-outline btn-block" onclick="openTopicDetailSheet('${subjectId}', '${topicId}')">Cancel</button>
          <button class="btn btn-danger btn-block" onclick="executeDeleteTopic('${subjectId}', '${topicId}')">Delete</button>
        </div>
      `);
    }

    function executeDeleteTopic(subjectId, topicId) {
      const sub = findSubject(subjectId);
      if (!sub) return;
      sub.topics = sub.topics.filter((t) => t.id !== topicId);
      saveState();
      closeSheet();
      render();
      showSnackbar('Topic deleted.');
    }

    function confirmDeleteSubject(subjectId) {
      const sub = findSubject(subjectId);
      if (!sub) return;
      openSheet('Delete Subject?', `
        <p style="font-size:13.5px; color:var(--text-secondary); margin-bottom:16px;">
          Delete <strong>${escapeHtml(sub.name)}</strong> along with its ${sub.topics.length} topic(s) and logs?
        </p>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-outline btn-block" onclick="closeSheet()">Cancel</button>
          <button class="btn btn-danger btn-block" onclick="executeDeleteSubject('${subjectId}')">Delete Subject</button>
        </div>
      `);
    }

    function executeDeleteSubject(subjectId) {
      state.data.subjects = state.data.subjects.filter((s) => s.id !== subjectId);
      state.expandedSubjectIds.delete(subjectId);
      saveState();
      closeSheet();
      render();
      showSnackbar('Subject deleted.');
    }

    function confirmResetSyllabus() {
      openSheet('Reset to Official Syllabus?', `
        <p style="font-size:13.5px; color:var(--text-secondary); margin-bottom:16px;">
          This will restore the official 7-subject (120 Marks) JKSSB JE Mechanical Syllabus and erase current progress logs. Consider exporting a backup first.
        </p>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-outline btn-block" onclick="closeSheet()">Cancel</button>
          <button class="btn btn-danger btn-block" onclick="executeResetSyllabus()">Reset Everything</button>
        </div>
      `);
    }

    function executeResetSyllabus() {
      state.data = getOfficialSyllabusSeed();
      state.expandedSubjectIds = new Set([state.data.subjects[0].id]);
      saveState();
      closeSheet();
      render();
      showSnackbar('Official JKSSB JE Mechanical syllabus restored.');
    }

    /* =========================================================================
       14. EXPORT / IMPORT JSON BACKUP
       ========================================================================= */
    function exportBackupJSON() {
      try {
        const jsonStr = JSON.stringify(state.data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `jkssb_je_mech_backup_${getLocalDateKey(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showSnackbar('Backup JSON exported!');
      } catch (err) {
        console.error(err);
        showSnackbar('Could not export backup.');
      }
    }

    function triggerImportJSON() {
      document.getElementById('json-file-input').click();
    }

    function handleImportFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.subjects)) {
            throw new Error('Invalid backup structure');
          }
          state.data = parsed;
          state.expandedSubjectIds = new Set(parsed.subjects[0] ? [parsed.subjects[0].id] : []);
          saveState();
          render();
          showSnackbar('Backup restored successfully!');
        } catch (err) {
          console.error(err);
          showSnackbar('Invalid JSON backup file.');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    /* =========================================================================

    function switchTab(tabName) {

        input.setSelectionRange(val.length, val.length);

      render();

    /* =========================================================================
       16. INITIALIZATION & GLOBAL EVENT LISTENERS
       ========================================================================= */
    function initApp() {
      initTheme();
      loadState();

      // Bottom Navigation
      document.querySelectorAll('.nav-item').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      // Theme Toggle
      document.getElementById('btn-theme-toggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      // Context-Aware FAB
      document.getElementById('fab-btn').addEventListener('click', () => {
        if (state.activeTab === 'syllabus') {
          openSubjectFormSheet();
        } else {
          openLogSheet();
        }
      });

      // Sheet Close Controls
      document.getElementById('sheet-close').addEventListener('click', closeSheet);
      document.getElementById('sheet-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'sheet-backdrop') closeSheet();
      });

      // JSON File Import
      document.getElementById('json-file-input').addEventListener('change', handleImportFile);

      render();
    }

    // Boot App
    initApp();
  </script>
</body>
</html>
